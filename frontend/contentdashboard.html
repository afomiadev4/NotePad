<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create New Note - NotePad+</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4A5568", // Deep Slate Blue
                        "background-light": "#F9F9F9",
                        "background-dark": "#111621",
                        "text-light": "#2D2D2D", // Dark Charcoal Grey
                        "text-dark": "#E2E8F0", // Light Grey for Dark Mode
                        "placeholder-light": "#A9A9A9",
                        "placeholder-dark": "#64748B",
                        "component-bg-light": "#FFFFFF",
                        "component-bg-dark": "#1E293B"
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .form-input::placeholder {
            color: #A9A9A9;
        }
        .dark .form-input::placeholder {
            color: #64748B;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="flex h-screen w-full flex-col">
<!-- Top App Bar -->
<header class="flex flex-shrink-0 items-center justify-between p-4 bg-background-light dark:bg-background-dark">
<button class="flex size-10 items-center justify-center text-text-light dark:text-text-dark">
<span class="material-symbols-outlined text-2xl">arrow_back_ios_new</span>
</button>
<div class="flex items-center gap-4">
<button class="flex size-10 items-center justify-center text-text-light dark:text-text-dark">
<span class="material-symbols-outlined text-2xl">more_horiz</span>
</button>
<button class="rounded-lg bg-primary px-4 py-2 text-base font-bold leading-normal text-white">
                    Done
                </button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex flex-1 flex-col overflow-y-auto px-4">
<!-- Title TextField -->
<div class="flex-shrink-0 py-3">
<label class="flex flex-col">
<input class="form-input w-full resize-none overflow-hidden border-none bg-transparent p-0 text-2xl font-bold text-text-light dark:text-text-dark placeholder-placeholder-light dark:placeholder-placeholder-dark focus:outline-0 focus:ring-0" placeholder="Title" value=""/>
</label>
</div>
<!-- MetaText -->
<p class="flex-shrink-0 pb-3 pt-1 text-sm font-normal leading-normal text-placeholder-light dark:text-placeholder-dark">May 20, 2024, 10:30 AM | 0 words</p>
<!-- Body TextField -->
<div class="flex-grow py-3">
<label class="flex h-full flex-col">
<textarea class="form-input h-full w-full flex-1 resize-none overflow-hidden border-none bg-transparent p-0 text-base font-normal leading-relaxed text-text-light dark:text-text-dark placeholder-placeholder-light dark:placeholder-placeholder-dark focus:outline-0 focus:ring-0" placeholder="Start writing..."></textarea>
</label>
</div>
</main>
<!-- ToolBar -->
<footer class="sticky bottom-0 flex-shrink-0 border-t border-t-slate-200 bg-background-light py-2 dark:border-t-slate-700 dark:bg-background-dark">
<div class="flex items-center justify-between gap-2 px-4">
<div class="flex gap-2">
<button class="p-2 text-text-light dark:text-text-dark rounded-full hover:bg-primary/20">
<span class="material-symbols-outlined text-2xl">format_bold</span>
</button>
<button class="p-2 text-text-light dark:text-text-dark rounded-full hover:bg-primary/20">
<span class="material-symbols-outlined text-2xl">format_italic</span>
</button>
<button class="p-2 text-text-light dark:text-text-dark rounded-full hover:bg-primary/20">
<span class="material-symbols-outlined text-2xl">format_list_bulleted</span>
</button>
<button class="p-2 text-text-light dark:text-text-dark rounded-full hover:bg-primary/20">
<span class="material-symbols-outlined text-2xl">attach_file</span>
</button>
<button class="p-2 text-text-light dark:text-text-dark rounded-full hover:bg-primary/20">
<span class="material-symbols-outlined text-2xl">add_photo_alternate</span>
</button>
</div>
</div>
</footer>
</div>
</body></html>
